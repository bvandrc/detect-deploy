name: Poll for Deploy
description: Polls a URL until its content changes, to detect when a deploy has actually gone live.
author: bvandrc

branding:
  icon: refresh-cw
  color: blue

inputs:
  url:
    description: The URL to poll.
    required: true
  max-attempts:
    description: Maximum number of polling attempts before giving up.
    required: false
    default: "45"
  interval-seconds:
    description: Seconds to wait between polling attempts.
    required: false
    default: "20"

outputs:
  deployed:
    description: >
      "true" if a new deploy was detected before max-attempts was reached,
      "false" otherwise.
    value: ${{ steps.poll.outputs.deployed }}

runs:
  using: composite
  steps:
    # Cache keys are immutable, so every run writes a new key and reads back the
    # most recent one matching the prefix. The url is digested rather than used
    # directly because cache keys treat commas as separators. The job is part of
    # the key so two jobs polling the same url in one run don't collide on it;
    # it is not part of the prefix, so they still read each other's hashes.
    - name: Derive cache key
      id: key
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        set -euo pipefail
        ID=$(printf '%s' "$URL" | sha256sum | cut -c1-32)
        echo "prefix=poll-for-deploy-v1-$ID-" >> "$GITHUB_OUTPUT"
        echo "key=poll-for-deploy-v1-$ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_OUTPUT"

    - name: Restore recorded hash
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/poll-for-deploy
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    # Vite (and most modern bundlers) content-hash every asset filename, so the
    # served index.html changes on every build -- poll until it differs from the
    # baseline instead of guessing a fixed delay.
    #
    # The baseline is whatever this URL last served as of the previous run. A
    # baseline captured now would be wrong whenever the deploy beat the runner
    # to it: the "before" picture would already be the new page, and the poll
    # would time out on a deploy that had in fact gone live.
    - name: Wait for new deploy
      id: poll
      shell: node {0}
      env:
        POLL_URL: ${{ inputs.url }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        INTERVAL: ${{ inputs.interval-seconds }}
        STATE_DIR: ${{ runner.temp }}/poll-for-deploy
      run: |
        const fs = require('fs');
        const crypto = require('crypto');

        const url = process.env.POLL_URL;
        const stateDir = process.env.STATE_DIR;
        const stateFile = `${stateDir}/hash`;

        const integer = (name) => {
          const raw = process.env[name] ?? '';
          if (!/^\d+$/.test(raw)) {
            console.log(`::error::${name} must be a non-negative integer, got '${raw}'.`);
            process.exit(1);
          }
          return Number(raw);
        };

        const maxAttempts = integer('MAX_ATTEMPTS');
        const interval = integer('INTERVAL');

        const setOutput = (key, value) =>
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
        const sleep = (seconds) => new Promise((r) => setTimeout(r, seconds * 1000));

        // Used for both the baseline and every poll, so the two can never be
        // hashed differently -- which would report a change on the first attempt
        // of every run. Redirects are followed: the curl this replaced did not,
        // so a url that 301s hashed an empty body that never changed.
        const fetchHash = async () => {
          const res = await fetch(url, { redirect: 'follow', signal: AbortSignal.timeout(30_000) });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const body = Buffer.from(await res.arrayBuffer());
          return crypto.createHash('sha256').update(body).digest('hex');
        };

        // The hash output is internal: it tells the save step there is a hash
        // worth persisting. Only `deployed` is exposed by the action.
        const record = (hash) => {
          fs.writeFileSync(stateFile, `${hash}\n`);
          setOutput('hash', hash);
        };

        const main = async () => {
          fs.mkdirSync(stateDir, { recursive: true });

          let baseline = null;
          let source = 'live';
          if (fs.existsSync(stateFile)) {
            const cached = fs.readFileSync(stateFile, 'utf8').trim();
            // Ignore anything that isn't a sha256 digest, rather than baselining
            // against a truncated or corrupted cache entry.
            if (/^[0-9a-f]{64}$/.test(cached)) {
              baseline = cached;
              source = 'cache';
            } else {
              console.log(`::warning::Discarding malformed cached hash for ${url}.`);
            }
          }

          // Only reachable before the first hash is recorded (or after the entry
          // is evicted); there is nothing else to compare against yet.
          if (!baseline) {
            console.log(`::notice::No hash recorded for ${url} yet, so this run is baselining against the page as it looks now. If the deploy already went live, this run may not detect it.`);
            try {
              baseline = await fetchHash();
            } catch (err) {
              console.log(`::error::Failed to compute a checksum for ${url}; cannot establish a baseline. (${err.message})`);
              process.exit(1);
            }
          }

          console.log(`Baseline (${source}): ${baseline}`);

          for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            let current = null;
            try {
              current = await fetchHash();
            } catch (err) {
              console.log(`Attempt ${attempt}/${maxAttempts}: request failed (${err.message}).`);
            }

            if (current && current !== baseline) {
              console.log(`Attempt ${attempt}/${maxAttempts}: new deploy detected (${current}).`);
              record(current);
              setOutput('deployed', 'true');
              return;
            }
            if (current) console.log(`Attempt ${attempt}/${maxAttempts}: unchanged.`);
            if (attempt < maxAttempts) await sleep(interval);
          }

          console.log(`No new deploy detected after ${maxAttempts * interval} seconds.`);
          record(baseline);
          setOutput('deployed', 'false');
        };

        main().catch((err) => {
          console.log(`::error::${err.stack || err.message}`);
          process.exit(1);
        });

    # Runs even when the poll timed out, so the recorded hash stays fresh
    # against the cache's eviction window.
    - name: Record hash for the next run
      if: always() && steps.poll.outputs.hash != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/poll-for-deploy
        key: ${{ steps.key.outputs.key }}
