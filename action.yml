name: Detect Deploy
description: >-
  Polls a URL until its content changes from the last run's, detecting a deploy
  that went live -- even before the run.
author: bvandrc

branding:
  icon: refresh-cw
  color: blue

inputs:
  url:
    description: The URL to poll.
    required: true
  max-seconds:
    description: |
      How long to keep polling before giving up.
        - NOTE: Set the job's timeout-minutes above this!
        - 0 makes one request and returns without waiting.
    required: false
    default: "900" # 15 minutes
  interval-seconds:
    description: Seconds to wait between polling attempts.
    required: false
    default: "20"
  assume-deployed-on-first-run:
    description: |
      How to resolve a run with no recorded hash to compare against -- the
      first run for a URL, or the first after a cache entry is evicted.
        - true (default): report deployed=true without polling, so dependent
          steps run instead of being skipped. They may run against the old
          build, since nothing proves the deploy has landed.
        - false: baseline against the page as it looks now and poll as usual.
          Catches a deploy that lands during the polling window, but not one
          that was already live; reports deployed=false if neither happens.
      Either way the hash is recorded, so later runs compare exactly.
    required: false
    default: "true"

outputs:
  deployed:
    description: >
      "true" if a new deploy was detected within max-seconds, "false"
      otherwise.

runs:
  using: node24
  main: dist/index.js
