name: Cleanup wait-for-deploy run

# wait-for-deploy.yml can't delete its own run -- the GitHub API only allows
# deleting a run once it's completed, and a run isn't completed while it's
# still the one making the API call. So a separate run does the deleting,
# triggered once wait-for-deploy.yml finishes. Every run of it gets deleted
# unconditionally: it's a dispatcher, not something worth keeping history of.

on:
  workflow_run:
    workflows: [Wait for deploy]
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the wait-for-deploy run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.deleteWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
