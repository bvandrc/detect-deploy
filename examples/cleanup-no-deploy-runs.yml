name: Cleanup no-deploy runs

# Deletes runs of "Production Lighthouse" (or whatever workflow you point
# workflow_run at) that uploaded a no-deploy-marker artifact, so a push that
# never resulted in a deploy leaves no trace in Actions history.

on:
  workflow_run:
    workflows: [Production Lighthouse]
    types: [completed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete run if it has a no-deploy marker
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            const hasMarker = artifacts.some(a => a.name === 'no-deploy-marker');
            if (!hasMarker) {
              console.log('No no-deploy-marker artifact found; keeping run.');
              return;
            }

            console.log(`Deleting run ${context.payload.workflow_run.id} (no-deploy-marker found).`);
            await github.rest.actions.deleteWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
