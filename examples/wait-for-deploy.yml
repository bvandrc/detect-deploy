name: Wait for deploy

# Polls for a deploy after a push, and if one lands, dispatches the
# post-deploy-checks workflow. This run is deleted afterwards regardless of
# outcome -- see cleanup-wait-for-deploy.yml -- so it never has to decide
# whether to keep or discard itself.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  wait-for-deploy:
    name: Wait for deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      deployed: ${{ steps.poll.outputs.deployed }}

    steps:
      - name: Poll for deploy
        id: poll
        uses: bvandrc/poll-for-deploy@v1
        with:
          url: https://example.com

      - name: Trigger post-deploy checks
        if: steps.poll.outputs.deployed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'post-deploy-checks.yml',
              ref: context.ref,
            });
