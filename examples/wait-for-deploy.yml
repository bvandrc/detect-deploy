name: Wait for deploy

on:
  push:
    branches:
      - main

jobs:
  wait-for-deploy:
    name: Wait for deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      deployed: ${{ steps.poll.outputs.deployed }}

    steps:
      - name: Poll for deploy
        id: poll
        uses: bvandrc/poll-for-deploy@v1
        with:
          url: https://example.com

  post-deploy-checks:
    name: Post-deploy checks
    needs: wait-for-deploy
    if: always() && needs.wait-for-deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "run your post-deploy checks here"
